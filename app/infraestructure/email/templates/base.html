<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>{{ title }}</title>
    </head>
    <body
        style="
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        "
    >
        <div
            style="
                max-width: 600px;
                margin: auto;
                background: white;
                padding: 30px;
            "
        >
            <h2>{{ app_name }}</h2>

            {% block content %}{% endblock %}

            <hr />

            <p style="font-size: 12px; color: #777">
                This is an automated message. Please do not reply.
            </p>
        </div>
    </body>
</html>
